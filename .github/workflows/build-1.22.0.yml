name: Compilar ArlightCore 1.22.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['agent/**', 'feature/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar versión
        run: |
          grep -q '<version>1.22.0</version>' pom.xml
          grep -q "version: '1.22.0'" src/main/resources/plugin.yml
      - name: Compilar y probar
        run: mvn -B -U clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: ArlightCore-1.22.0-JAR
          path: target/ArlightCore-1.22.0.jar
          if-no-files-found: error
