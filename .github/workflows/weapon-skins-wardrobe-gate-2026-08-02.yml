name: Validar skins de armas por ropero 2026-08-02

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'agent/weapon-skins-wardrobe-gate-2026-08-02'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuentes corregidas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1IKwo3tsk4mTTRzHUa5lLEXwkUSBpHLz4 -O /tmp/weapon-fix.zip
          echo 'e7990f1cf21953d1ebe2d327e0eeb5f838d91c1344b8fb79e9611b9d6b140c75  /tmp/weapon-fix.zip' | sha256sum -c -
          unzip -q /tmp/weapon-fix.zip -d /tmp/weapon-fix
          test -d /tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX
          test -d /tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE

      - name: Compilar CosmeticsCurios 1.17.3
        shell: bash
        working-directory: /tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          test -s build/libs/ArlightCosmeticsCurios-1.17.3.jar

      - name: Preparar dependencia corregida
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02
          cp "$ROOT/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX/build/libs/ArlightCosmeticsCurios-1.17.3.jar" \
             "$ROOT/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE/libs/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX.jar"

      - name: Compilar WeaponSkins 1.9.0
        shell: bash
        working-directory: /tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          test -s build/libs/ArlightWeaponSkins-1.9.0.jar

      - name: Verificar versiones y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/weapon-fix/Arlight-Weapon-Skins-Wardrobe-Fix-2026-08-02
          mkdir -p result
          cp "$ROOT/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX/build/libs/ArlightCosmeticsCurios-1.17.3.jar" result/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX.jar
          cp "$ROOT/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE/build/libs/ArlightWeaponSkins-1.9.0.jar" result/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE.jar
          unzip -p result/ArlightCosmeticsCurios-1.17.3-WEAPON-UNEQUIP-FIX.jar META-INF/neoforge.mods.toml | grep -F 'version="1.17.3"'
          unzip -p result/ArlightWeaponSkins-1.9.0-WARDROBE-SELECTION-GATE.jar META-INF/neoforge.mods.toml | grep -F 'version="1.9.0"'
          sha256sum result/*.jar > result/SHA256.txt
          cp "$ROOT/LEEME.md" result/

      - name: Subir JAR validados
        uses: actions/upload-artifact@v4
        with:
          name: Arlight-Weapon-Skins-Wardrobe-Fix-VALIDATED
          path: result/
          if-no-files-found: error
          retention-days: 30
