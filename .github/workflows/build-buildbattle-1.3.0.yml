name: Compilar ArlightBuildBattle 1.3.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'agent/buildbattle-1.3.0-ci'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar versiones
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.22.0</version>' pom.xml
          grep -q '<version>1.3.0</version>' ci/ArlightBuildBattle/pom.xml
          grep -q 'version: 1.3.0' ci/ArlightBuildBattle/src/main/resources/plugin.yml
      - name: Instalar ArlightCore 1.22.0
        run: mvn -B -DskipTests clean install
      - name: Compilar Build Battle 1.3.0
        run: mvn -B -f ci/ArlightBuildBattle/pom.xml clean package
      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ci/ArlightBuildBattle/target/ArlightBuildBattle-1.3.0.jar dist/
          unzip -p dist/ArlightBuildBattle-1.3.0.jar plugin.yml | grep -q '^version: 1.3.0$'
          unzip -l dist/ArlightBuildBattle-1.3.0.jar | grep -q 'ArlightBuildBattlePlugin.class'
      - uses: actions/upload-artifact@v4
        with:
          name: ArlightBuildBattle-1.3.0-JAR
          path: dist/ArlightBuildBattle-1.3.0.jar
          if-no-files-found: error
