name: ArlightCore
version: '1.0.0'
main: com.arlight.core.ArlightCorePlugin
api-version: '1.21'
author: Arlight
description: Nucleo compartido para los minijuegos del servidor Arlight (items de menu, XP/niveles, recompensas)

commands:
  core:
    description: Comando principal de ArlightCore
    usage: /core <items|rewards|reward|reload>
    permission: arlightcore.use

permissions:
  arlightcore.use:
    description: Permite usar el comando /core
    default: true
  arlightcore.admin:
    description: Permite administrar recompensas y XP
    default: op
